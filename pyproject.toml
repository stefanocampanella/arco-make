[project]
name = "arcomake"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "botocore[crt]",
    "cdsapi",
    "cfgrib",
    "cftime",
    "click",
    # Upstream main after the merge of COPERNICUSMARINE_MAX_POOL_CONNECTIONS (#532), not yet in a
    # release; move to the first release that has it. The backend relies on chunk_size_limit=False
    # returning lazily indexed arrays (undocumented): tests/live checks it.
    "copernicusmarine @ git+https://github.com/mercator-ocean/copernicus-marine-toolbox.git@f66a8b8c700654fec981b986fc79f6450298e96a",
    "dask",
    "dask_mpi",
    "distributed",
    "eccodes",
    "etils",
    "gcsfs",
    "google-cloud-storage",
    "h5netcdf",
    "matplotlib",
    "mpi4py",
    "nc-time-axis",
    "netCDF4",
    "numpy",
    "pandas",
    "pydantic",
    "requests",
    "s3fs>2026",
    "tqdm",
    "xarray[complete]",
    "xarray-regrid[accel]",
    "zarr >= 3.4",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "numba>=0.61",
    "icechunk>=2.3.1",
    "aiohttp>=3.10",
]
authors = [{name = "Stefano Campanella", email = "scampanella@ogs.it"}]
description = "Utility to download and preprocess data into ARCO format."
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"

[project.optional-dependencies]
dev = [
    "pandas-stubs~=3.0.3",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "reuse",
    "ruff",
    "ty",
    "memray",
]
# Live checks (tests/live): ECMWF's ecCodes build, recent enough for GloFAS GRIB, matching the
# `eccodes` bindings in uv.lock.
live = [
    "eccodeslib==2.49.*",
]
experimental = [
    "flox>=0.11.2",
    "frisky",
]

[project.entry-points."xarray.backends"]
copernicusmarine = "arcomake.backends:CopernicusMarine"
netcdfoverhttp = "arcomake.backends:NetCDFOverHTTP"
earlywarningdatastore = "arcomake.backends:EarlyWarningDataStore"
icechunk = "arcomake.backends:Icechunk"

[project.scripts]
arco-make = "arcomake:cli"

[project.urls]
Homepage = "https://github.com/stefanocampanella/arco-make"

[build-system]
requires = ["uv_build >= 0.11.7"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 100
indent-width = 2
extend-exclude = [
    ".venv",
    "build",
    "dist",
    "scripts",
    "notebooks",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B028", "UP047", "SIM118"]

[tool.ruff.lint.isort]
known-first-party = ["arcomake"]

[tool.ty]
# Keep defaults; configure project environment explicitly.

[tool.ty.environment]
python-version = "3.13"
root = ["."]

[tool.ty.src]
include = ["src/arcomake/**/*.py"]
respect-ignore-files = true

[tool.ty.rules]
# Every rule is an error: the type checker gates commits (pre-commit) and CI.
all = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live checks (marker `network`) are skipped unless `--live` is given (tests/conftest.py).
addopts = ["-ra", "--strict-markers"]
xfail_strict = true
markers = [
    "network: needs the live services and their credentials; never run on pull requests",
]
