name: Integration Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev
          
      - name: Install package
        run: |
          pip install .
          
      - name: Run integration test
        run: |
          arco-make download --start=2001-01-01 --end=2001-01-02 --progress --overwrite configs/arco-ocean_tres-1d_res-0p25_levels-10.toml /tmp/tempfile.zip

      - name: Verify output
        run: |
          ls -l /tmp/tempfile.zip
