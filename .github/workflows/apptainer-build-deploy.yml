name: Build Apptainer Image

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

jobs:
  build:
    name: Build Apptainer Image (AMD64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    container:
      image: ghcr.io/apptainer/apptainer:latest
      options: --privileged
    steps:

      - name: Check out code for the container builds
        uses: actions/checkout@v6

      - name: Build Container
        run: |
           apptainer build container.sif Apptainer

      - name: Compute image tag from branch name
        id: tag
        run: |
          # Use the branch name as the image tag, sanitizing characters
          # that are not allowed in OCI/registry tags (e.g. "/").
          raw_ref="${{ github.head_ref || github.ref_name }}"
          tag="${raw_ref//\//-}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Login and Deploy Container
        # Use default registry user ${{ github.repository_owner }} , or set a secret ${{ secrets.GHCR_USERNAME }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          echo ${{ secrets.GITHUB_TOKEN }} | apptainer registry login -u ${{ github.repository_owner }} --password-stdin oras://ghcr.io
          apptainer push container.sif "oras://ghcr.io/${GITHUB_REPOSITORY}:${tag}"