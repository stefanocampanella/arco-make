name: CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          # As in the Apptainer image.
          python-version: "3.13"
      # The `mpi` extra for ty to check dask_utils (mpi4py's wheel needs no MPI to install).
      - run: uv sync --frozen --extra dev --extra mpi
      - run: uv run --frozen ruff check
      - run: uv run --frozen ruff format --check
      - run: uv run --frozen ty check

  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: fsfe/reuse-action@v6

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan the history for secrets
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose .

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - name: Install Open MPI and ecCodes
        # mpirun and the MPI library, for the `mpi` setup's test (tests/test_mpi.py); ecCodes, for
        # the GRIB files tests/test_ecmwf_open_data.py writes (skipped without it).
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          openmpi-bin libeccodes-dev
      - run: uv sync --frozen --extra dev --extra mpi
      - run: uv run --frozen pytest --cov=arcomake --cov-report=term-missing --cov-fail-under=80
