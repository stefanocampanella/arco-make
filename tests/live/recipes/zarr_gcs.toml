# Live check: a public Zarr store on Google Cloud Storage (ERA5, anonymous), one day, a small box.
time_dim = "time"
start = 2020-01-01T00:00:00
end = 2020-01-02T00:00:00
step = "1D"

[[datasets.era5.parts]]
filename_or_obj = "gs://gcp-public-data-arco-era5/ar/full_37-1h-0p25deg-chunk-1.zarr-v3"
engine = "zarr"
consolidated = true
# gcsfs sends no timeout by default, and a read can hang forever: the part's `timeout` (seconds
# of silence) reaches gcsfs as a timeout that it retries (not `requests_timeout`, a total).
timeout = 120
storage_options = {token = "anon"}
chunks = {time = 24, latitude = -1, longitude = -1}

[[datasets.era5.postprocess]]
name = "select_variables"
variables = ["2m_temperature"]

[[datasets.era5.postprocess]]
name = "sel"
latitude = {start = 46.0, stop = 40.0}
longitude = {start = 12.0, stop = 20.0}

[[datasets.era5.postprocess]]
name = "resample"
time = "1 D"
label = "left"
closed = "left"
reduce = "mean"

[save]
compressors = [{name = "blosc", configuration = {cname = "lz4", clevel = 1, shuffle = "shuffle"}}]
