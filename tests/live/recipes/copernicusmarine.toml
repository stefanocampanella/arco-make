# Live check: Copernicus Marine (GLORYS12 reanalysis), one day, the top level, a small box.
# Needs COPERNICUSMARINE_SERVICE_USERNAME and COPERNICUSMARINE_SERVICE_PASSWORD.
time_dim = "time"
start = 2020-01-01T00:00:00
end = 2020-01-02T00:00:00
step = "1D"

[[datasets.glorys.parts]]
filename_or_obj = "cm://cmems_mod_glo_phy_my_0.083deg_P1D-m"
engine = "copernicusmarine"
variables = ["thetao"]
dataset_version = "202311"
dataset_part = "default"
service = "arco-geo-series"

[[datasets.glorys.postprocess]]
name = "isel"
depth = [0]

[[datasets.glorys.postprocess]]
name = "sel"
latitude = {start = 40.0, stop = 46.0}
longitude = {start = 12.0, stop = 20.0}

[save]
compressors = [{name = "blosc", configuration = {cname = "lz4", clevel = 1, shuffle = "shuffle"}}]
